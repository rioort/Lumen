name: Build (macOS + Windows)

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configura (binario universale Apple Silicon + Intel)
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DLUMEN_COPY_AFTER_BUILD=ON
          -DLUMEN_BUILD_TESTS=ON

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del motore audio
        run: |
          TEST_BIN=$(find build -name LumenDspTests -type f -perm +111 | head -1)
          "$TEST_BIN"

      - name: Validazione Audio Unit (auval)
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Lmn1 Vibe

      - name: Validazione con pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          validate () {
            code=0
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests --validate-in-process \
              --timeout-ms 600000 "$1" > pv.log 2>&1 || code=$?
            tail -40 pv.log
            if [ $code -ne 0 ]; then
              echo "::error title=pluginval $(basename "$1")::$(grep -iE 'fail|error|!!!' pv.log | tail -8 | tr '\n' ' ' | cut -c1-900) | $(tail -6 pv.log | tr '\n' ' ' | cut -c1-500)"
              exit $code
            fi
          }
          validate build/Lumen_artefacts/Release/VST3/Lumen.vst3
          validate ~/Library/Audio/Plug-Ins/Components/Lumen.component

      - name: Prepara il pacchetto
        run: |
          mkdir -p dist
          cp -R build/Lumen_artefacts/Release/VST3/Lumen.vst3 dist/
          cp -R build/Lumen_artefacts/Release/AU/Lumen.component dist/
          codesign --force --deep -s - dist/Lumen.vst3
          codesign --force --deep -s - dist/Lumen.component
          cp INSTALLA.txt dist/
          cd dist && zip -r -y ../Lumen-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS
          path: Lumen-macOS.zip
          retention-days: 30

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configura (64 bit)
        run: cmake -S . -B build -A x64 -DLUMEN_BUILD_TESTS=ON

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del motore audio
        run: |
          $test = Get-ChildItem -Path build -Recurse -Filter LumenDspTests.exe | Select-Object -First 1
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validazione con pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = Get-ChildItem -Path pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pv.FullName --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 600000 build/Lumen_artefacts/Release/VST3/Lumen.vst3 *> pv.log
          $code = $LASTEXITCODE
          Get-Content pv.log -Tail 40
          if ($code -ne 0) {
            $msg = ((Get-Content pv.log | Select-String -Pattern 'fail|error|!!!' | Select-Object -Last 8) -join ' ')
            Write-Output "::error title=pluginval::$msg"
            exit $code
          }

      - name: Prepara il pacchetto
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse build/Lumen_artefacts/Release/VST3/Lumen.vst3 dist/
          Copy-Item INSTALLA-Windows.txt dist/INSTALLA.txt
          Compress-Archive -Path dist/* -DestinationPath Lumen-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows
          path: Lumen-Windows.zip
          retention-days: 30

  # Ad ogni aggiornamento di "main" pubblica (o aggiorna) la pagina di download
  # pubblica della versione indicata in CMakeLists.txt: senza login, senza scadenza.
  release:
    name: Pubblica la versione
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Leggi il numero di versione
        id: ver
        run: echo "version=$(grep -oP 'project\(Lumen VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen v${{ steps.ver.outputs.version }}
          make_latest: true
          files: artifacts/**/*.zip
          body: |
            **Lumen** – compressore ottico a valvole.

            Scarica il file per il tuo computer (in fondo, sotto *Assets*):
            - **Lumen-macOS.zip** – Mac (Apple Silicon e Intel), formati VST3 e AU
            - **Lumen-Windows.zip** – Windows 10/11 a 64 bit, formato VST3

            Dentro ogni zip c'è il file **INSTALLA.txt** con i passaggi di installazione.
